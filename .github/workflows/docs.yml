name: Publish Docs

# Builds this repository's own docs (docs/ + bxsites.yaml at the repo root)
# with BX Sites (https://ortus-boxlang.github.io/bx-sites/), using its
# default "bootstrap" theme, and publishes the result to GitHub Pages
# at the site root.
#
# One-time setup required before this workflow can publish anything:
#   1. Let this workflow run once (it creates the gh-pages branch for you)
#   2. Settings -> Pages -> Build and deployment -> Source: "Deploy from a branch"
#   3. Settings -> Pages -> Branch: gh-pages, folder: / (root)

on:
  push:
    branches:
      - main
      - development
    paths:
      - "docs/**"
      - "bxsites.yaml"
      - ".github/workflows/docs.yml"

  # Manual trigger, for a one-off republish without a new commit
  workflow_dispatch:

permissions:
  contents: write

# Serialize docs deploys so only one publish runs at a time.
concurrency:
  group: "pages-docs"
  cancel-in-progress: false

jobs:
  build:
    name: Build & Publish Docs (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # bx-sites ships its own "bxSites" executable script via its module
      # install (same mechanism bx-cli uses for its "box" script) -- no
      # CommandBox needed just to build the site. Pinned to @main (latest)
      # rather than a released tag so this picks up the setup-boxlang fix
      # (ortus-boxlang/setup-boxlang#11) that adds ${BOXLANG_HOME}/bin to
      # $GITHUB_PATH -- without it, module-provided executables like
      # "bxSites" land outside PATH and the build step below fails with
      # "bxSites: command not found".
      - name: Setup BoxLang + BX Sites
        uses: ortus-boxlang/setup-boxlang@main
        with:
          modules: bx-sites bx-markdown bx-yaml bx-image

      - name: Build the site
        run: bxSites build

      - name: Deploy docs to the site root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
