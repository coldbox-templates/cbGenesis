name: Pull Requests

on:
  push:
    branches-ignore:
      - "main"
      - "master"
      - "development"
      - "v*"
  pull_request:
    branches:
      - "v*"
      - "development"

  # Manual Trigger
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  # Disabled: the Ortus-Solutions/commandbox-action@v1.0.2 step below runs inside
  # ghcr.io/foundeo/cfml-ci-tools/cfml-ci-tools:1.0.6, which doesn't have `boxlang` on
  # PATH, so `box run-script format:check` (which shells out to `boxlang format`) always
  # fails with "boxlang: not found" (exit 127) -- unrelated to any actual formatting.
