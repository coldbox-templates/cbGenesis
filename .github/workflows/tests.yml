name: Test Suites

on:
  workflow_call:

  # Manual Trigger
  workflow_dispatch:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cbgenesis
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_DRIVER: MySQL
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: cbgenesis
      DB_SCHEMA: cbgenesis
      DB_USER: root
      DB_PASSWORD: root
      DB_BUNDLENAME: ""
      DB_BUNDLEVERSION: ""
      WEB_PORT: 60299
      JDK_VERSION: "21"
    strategy:
      fail-fast: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JDK_VERSION }}

      # bx-cli's own module install creates its "box" executable script (confirmed in
      # CI output: "Creating executable script: box"), so it stands in for CommandBox
      # on its own -- no separate `with-commandbox` / legacy CommandBox download needed.
      - name: Setup BoxLang (with bx-cli module)
        uses: ortus-boxlang/setup-boxlang@main
        with:
          version: latest
          modules: bx-cli

      # install-bx-module writes module-provided executables (like bx-cli's "box"
      # script) to ${BOXLANG_HOME}/bin, not to the /usr/local/bin (or ~/.local/bin)
      # directory the installer links the core boxlang/bx binaries into. Neither the
      # quick installer nor the setup-boxlang action adds this directory to PATH, so
      # `box` is otherwise unreachable in every later step. BOXLANG_HOME itself is
      # already exported to $GITHUB_ENV by the action above.
      - name: Link BoxLang module executables onto PATH
        run: |
          echo "${BOXLANG_HOME}/bin" >> $GITHUB_PATH

      - name: Install CommandBox CLI Modules
        run: |
          box install testbox-cli

      - name: Setup Environment For Testing Process
        run: |
          # Setup .env
          touch .env
          # ENV
          printf "DB_HOST=${{ env.DB_HOST }}\n" >> .env
          printf "DB_PORT=${{ env.DB_PORT }}\n" >> .env
          printf "DB_DATABASE=${{ env.DB_DATABASE }}\n" >> .env
          printf "DB_SCHEMA=${{ env.DB_SCHEMA }}\n" >> .env
          printf "DB_DRIVER=${{ env.DB_DRIVER }}\n" >> .env
          printf "DB_USER=${{ env.DB_USER }}\n" >> .env
          printf "DB_PASSWORD=${{ env.DB_PASSWORD }}\n" >> .env

      - name: Install Dependencies
        run: |
          box install

      - name: Run Migrations & Seed Database
        run: |
          box migrate install
          box migrate up
          box migrate seed run

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Build Frontend Assets
        run: |
          npm ci
          npm run build

      - name: Start ${{ matrix.cfengine }} Server
        run: |
          box server set web.http.port=${{ env.WEB_PORT }}
          box server start --debug
          curl http://127.0.0.1:${{ env.WEB_PORT }}

      - name: Run Tests
        run: |
          mkdir -p tests/results
          # antjunit output is dropped for now: box testbox run's JSON-to-ANTJunit-XML
          # conversion throws a fatal XML parse error ("element type br must be
          # terminated") on any failure/error whose message embeds TestBox's own
          # HTML-formatted code-context snippets (<br>/<b> tags), which aborts the
          # write of both output files. json alone is unaffected. The "Publish Test
          # Results" step below will report no files found until this is revisited.
          #
          # box testbox run's own exit code is not reliable -- it returns non-zero even
          # when every single spec passes -- and its outputFile write is itself flaky
          # (observed silently not writing the file at all on some runs), so this step
          # never fails on its own exit code. "Verify Test Results" below determines the
          # real pass/fail outcome from the JSON report TestBox prints to stdout.
          box testbox run --verbose outputFile=tests/results/test-results outputFormats=json > tests/results/raw-output.log 2>&1 || true
          cat tests/results/raw-output.log

      - name: Print JSON Test Results
        if: always()
        run: cat tests/results/test-results.json || echo "no json results file found"

      - name: Verify Test Results
        run: python3 tests/verify-results.py

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          junit_files: tests/results/**/*.xml
          check_name: "${{ matrix.cfengine }} Test Results"

      - name: Upload Test Results to Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.cfengine }}
          path: |
            tests/results/**/*

      - name: Show Server Log On Failures
        if: ${{ always() }}
        run: |
          box server log

      - name: Upload Debug Logs To Artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: Failure Debugging Info - ${{ matrix.cfengine }}
          path: |
            .engine/**/logs/*
