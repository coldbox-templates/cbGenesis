################################################################################
# CB Genesis Docker Compose Stack - PostgreSQL
#
# Usage (from the repo root):
#   docker compose -f resources/docker/docker-compose.postgresql.yml up -d
#   docker compose -f resources/docker/docker-compose.postgresql.yml exec coldbox_app box migrate up
#   docker compose -f resources/docker/docker-compose.postgresql.yml exec coldbox_app box migrate seed
################################################################################
services:

  coldbox_db:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: cbgenesis
      POSTGRES_USER: cbgenesis
      POSTGRES_PASSWORD: cbgenesis
    volumes:
      - .db/postgresql/data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cbgenesis -d cbgenesis" ]
      interval: 5s
      timeout: 5s
      retries: 10

  coldbox_app:
    depends_on:
      coldbox_db:
        condition: service_healthy
    image: ortussolutions/commandbox:boxlang
    environment:
      APPNAME: cbGenesis
      ENVIRONMENT: development
      BOXLANG_DEBUG: "true"
      ASSET_URL: /includes
      COLDBOX_REINIT_PASSWORD: ""
      JWT_SECRET: ""
      DB_DRIVER: postgresql
      DB_HOST: coldbox_db
      DB_PORT: 5432
      DB_SCHEMA: public
      DB_DATABASE: cbgenesis
      DB_USER: cbgenesis
      DB_PASSWORD: cbgenesis
    command:
      - /bin/bash
      - -c
      - >-
        box install bx-postgresql --noSave
        && $$BUILD_DIR/run.sh
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ../../:/app
