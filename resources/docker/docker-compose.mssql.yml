################################################################################
# CB Genesis Docker Compose Stack - Microsoft SQL Server
#
# Usage (from the repo root):
#   docker compose -f resources/docker/docker-compose.mssql.yml up -d
#   docker compose -f resources/docker/docker-compose.mssql.yml exec coldbox_app box migrate up
#   docker compose -f resources/docker/docker-compose.mssql.yml exec coldbox_app box migrate seed
################################################################################
services:

  coldbox_db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1434:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-CbGenesisMssql!2026}"
      MSSQL_PID: Developer
    volumes:
      - .db/mssql/data:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' -b -o /dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  mssql_init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      coldbox_db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-CbGenesisMssql!2026}"
    command:
      - /bin/bash
      - -c
      - >-
        /opt/mssql-tools18/bin/sqlcmd -C -S coldbox_db -U sa
        -P "$${MSSQL_SA_PASSWORD}"
        -Q "IF DB_ID(N'cbgenesis') IS NULL CREATE DATABASE [cbgenesis]"
    restart: "no"

  coldbox_app:
    depends_on:
      mssql_init:
        condition: service_completed_successfully
    image: ortussolutions/commandbox:boxlang
    environment:
      APPNAME: cbGenesis
      ENVIRONMENT: development
      BOXLANG_DEBUG: "true"
      ASSET_URL: /includes
      COLDBOX_REINIT_PASSWORD: ""
      JWT_SECRET: ""
      DB_DRIVER: mssql
      DB_HOST: coldbox_db
      DB_PORT: 1433
      DB_SCHEMA: dbo
      DB_DATABASE: cbgenesis
      DB_USER: sa
      DB_PASSWORD: "${MSSQL_SA_PASSWORD:-CbGenesisMssql!2026}"
    command:
      - /bin/bash
      - -c
      - >-
        box install bx-mssql --noSave
        && $$BUILD_DIR/run.sh
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ../../:/app
