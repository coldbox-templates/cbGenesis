################################################################################
# CB Genesis Docker Compose Stack
# Runs the app in a CommandBox/BoxLang container alongside a MySQL 8 database,
# for local development. The app container bind-mounts the whole repo, so
# code changes on the host are picked up without rebuilding the image.
#
# Usage (from the repo root):
#   docker compose -f resources/docker/docker-compose.yml up -d
#   docker compose -f resources/docker/docker-compose.yml exec coldbox_app box migrate up
#   docker compose -f resources/docker/docker-compose.yml exec coldbox_app box migrate seed
#   docker compose -f resources/docker/docker-compose.yml down
#
# See docs/deployment.md#docker for the full walkthrough, including running
# the Vite dev server for frontend assets.
################################################################################
services:

  ## PostgreSQL (swap in place of coldbox_db below; also update DB_DRIVER)
  # coldbox_db:
  #   image: postgres:12
  #   environment:
  #     POSTGRES_PASSWORD: "cbgenesis"
  #     POSTGRES_USER: "cbgenesis"
  #     POSTGRES_DB: "cbgenesis"
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - .db/postgres/initdb:/docker-entrypoint-initdb.d
  #     - .db/postgres/data:/var/lib/postgresql/data

  # mssql:
  #   image: mcr.microsoft.com/azure-sql-edge:latest
  #   ports:
  #     - "1434:1433"
  #   environment:
  #     SA_PASSWORD: "T35t1ng1234!"
  #     ACCEPT_EULA: "Y"
  #   volumes:
  #     - .db/mssql/tmp:/tmp/mssql

  # MySQL 8 - the default database for this template
  coldbox_db:
    image: mysql:8
    ports:
      # Host 3406 avoids colliding with a MySQL/MariaDB already running on
      # your machine's default 3306. The app talks to this container over
      # the internal Docker network on MySQL's real port, 3306 - not this one.
      - "3406:3306"
    environment:
      MYSQL_DATABASE: "cbgenesis"
      MYSQL_ROOT_PASSWORD: "cbgenesis"
    volumes:
      - .db/mysql8/data:/var/lib/mysql
      # Uncomment to auto-run SQL files here on first container creation
      #- ../resources/sql/mysql:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pcbgenesis" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # CB Genesis application server
  coldbox_app:
    depends_on:
      coldbox_db:
        condition: service_healthy
    image: ortussolutions/commandbox:boxlang
    environment:
      APPNAME: cbGenesis
      ENVIRONMENT: development
      BOXLANG_DEBUG: "true"
      ASSET_URL: /includes
      # Leaving this unset closes ?fwreinit in production; harmless locally.
      COLDBOX_REINIT_PASSWORD: ""
      JWT_SECRET: ""
      # Container-internal port: MySQL always listens on 3306 inside its own
      # container, regardless of the host port it's published on above.
      DB_DRIVER: MySQL
      DB_HOST: coldbox_db
      DB_PORT: 3306
      DB_SCHEMA: ""
      DB_DATABASE: cbgenesis
      DB_USER: root
      DB_PASSWORD: cbgenesis
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ../../:/app
